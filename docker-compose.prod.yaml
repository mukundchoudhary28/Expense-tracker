services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
  backend:
    image: ${REGISTRY}/expense-tracker-backend:${IMAGE_TAG}
  frontend:
    image: ${REGISTRY}/expense-tracker-frontend:${IMAGE_TAG}

volumes:
  caddy_data:
  caddy_config: